 </script>

<body>
  <!-- Sol üst köşeye buton eklendi -->
  <button onclick="window.location.href='replik.html'" style="position: absolute; top: 10px; left: 10px; border-radius: 10%; width: 80px; height: 80px; padding: 0;">
    <img src="../images/icon/ok.jpg" alt="Geri" style="width: 100%; height: 100%; border-radius: 15px;">
</button>
<!-- Yeni butonlar eklendi -->
<div style="text-align: center; margin-bottom: 20px;">
    <button onclick="window.location.href='yaprak.html'" style="border-radius: 50%; width: 80px; height: 80px; padding: 0;">
        <img src="../images/icon/soru.jpg" alt="Sayfa 1" style="width: 100%; height: 100%; border-radius: 50%;">
    </button>
    <button onclick="window.location.href='replik.html'" style="border-radius: 50%; width: 80px; height: 80px; padding: 0;">
        <img src="../images/icon/tırnak.jpg" alt="Sayfa 2" style="width: 100%; height: 100%; border-radius: 50%;">
    </button>
    <button onclick="window.location.href='yuz.html'" style="border-radius: 50%; width: 80px; height: 80px; padding: 0;">
        <img src="../images/icon/yuz.jpg" alt="Sayfa 3" style="width: 100%; height: 100%; border-radius: 50%;">
    </button>

  <h1>Yüz Tahmin Oyunu</h1>

  <!-- Yüz Resmi Kutusu -->
  <div class="yuz-container">
    <img id="yüzResmi" src="images/placeholder.jpg" alt="Yüz Resmi">
  </div>

  <!-- Tahmin Girişi -->
  <input type="text" id="tahminInput" placeholder="Yüz kime ait?">

  <!-- Dinamik Önerilerin Görüneceği Alan -->
  <section id="oyuncuSecim"></section>

  <button id="tahminButonu" onclick="tahminEt()">Tahmin Et</button>
  <button id="yeniSayfaButonu" style="display: none;" onclick="window.location.href='bulanık.html'">Sonraki Bölüm</button>

  <!-- Tahmin Tablosu -->
  <table id="sonucTablosu" border="1">
    <thead>
      <tr>
        <th>Tahmin</th>
      </tr>
    </thead>
    <tbody>
      <!-- Tahmin sonuçları buraya eklenecek -->
    </tbody>
  </table>

  <div id="sonuc"></div>

  <script src="yuz.js"></script>
</body>
